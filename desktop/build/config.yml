version: '3'

info:
  companyName: "LLM Meter"
  productName: "LLM Meter Relay"
  productIdentifier: "com.mishankov.llm-meter-relay"
  description: "Local macOS menu-bar relay for LLM Meter"
  copyright: "(c) 2026 LLM Meter"
  comments: "Local relay for LLM Meter"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
