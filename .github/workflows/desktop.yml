name: macOS relay

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'
  push:
    branches: ['main']
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - run: wails3 task package
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm run check --prefix frontend
      - run: npx playwright install webkit
        working-directory: desktop/frontend
      - run: npm test --prefix frontend
