name: Feature request
description: Suggest an improvement or new capability for LLM Meter
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use case
      description: What problem are you trying to solve, or what workflow is missing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, UI, CLI flag, or configuration you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you have tried or considered.
    validations:
      required: false
