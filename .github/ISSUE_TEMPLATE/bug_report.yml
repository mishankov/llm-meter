name: Bug report
description: Report a bug or unexpected behavior in LLM Meter
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! If you found a security vulnerability, please report it privately using our [Security Policy](https://github.com/mishankov/llm-meter/blob/main/SECURITY.md) instead of opening a public issue.

        **Before submitting:** redact any `DASHBOARD_TOKEN`, `llmm_...` proxy keys, and upstream API keys or `Authorization` headers from your report and logs.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of LLM Meter is affected?
      options:
        - Server
        - Dashboard
        - Local Relay CLI
        - macOS Menu Bar App
        - OpenTelemetry
        - Docs
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands, configuration, or actions needed to reproduce the issue.
      placeholder: |
        1. Start the server/relay with ...
        2. Send a request or open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. actual behavior
      description: Describe what you expected to happen and what actually happened.
      placeholder: |
        **Expected:** ...
        **Actual:** ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Image tag
      description: Release version, Docker image tag (e.g. `ghcr.io/mishankov/llm-meter:latest`), or commit SHA.
      placeholder: v0.1.0-alpha.1 / latest / commit SHA
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment / OS
      description: Operating system, deployment method (Docker, native Go binary, macOS app), and relevant client/browser versions.
      placeholder: macOS 15 / Docker 28 / Go 1.25 / Chrome
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server, relay, or client logs. Remember to redact `DASHBOARD_TOKEN`, `llmm_...` keys, and upstream API keys before pasting.
      render: text
    validations:
      required: false
